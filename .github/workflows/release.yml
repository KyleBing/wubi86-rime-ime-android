# 打 Release APK 并发布到本仓库的 Releases。
# 推送 v1.0.1 这类标签时自动打包；手动运行只打包，产物留在 Actions 里。
#
# 附件名固定为 MeifengWubi-Android.apk，不带版本号，说明站因此可以一直用
#   https://github.com/KyleBing/wubi86-rime-ime-android/releases/latest/download/MeifengWubi-Android.apk
# 这条链接，发新版本只换附件，不用改文档。版本号看 Release 标题。
# 同时会生成 update.json（带 sha256 和大小）。
#
# 需要的 Secrets（都可选，不配时用 debug 签名打 release 包，便于 CI 出包）：
#   ANDROID_KEYSTORE_BASE64   release keystore 的 base64
#   ANDROID_KEYSTORE_PASSWORD keystore 密码
#   ANDROID_KEY_ALIAS         密钥别名
#   ANDROID_KEY_PASSWORD      密钥密码
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 固定附件名：releases/latest/download/<这个名字> 是稳定地址
  ASSET_NAME: MeifengWubi-Android.apk

jobs:
  android:
    name: 打包 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 不依赖第三方 setup-android：直接装 cmdline-tools，再装编译所需包
      - name: 安装 Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o /tmp/cmdline-tools.zip
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          # zip 解出的目录名是 cmdline-tools，改成 latest 以符合 sdkmanager 约定
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 版本号以 app/build.gradle.kts 为准，发版前先改版本再打标签
      - name: 读取版本
        id: version
        run: |
          VERSION=$(grep -m1 -oE 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          CODE=$(grep -m1 -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          if [ -z "$VERSION" ] || [ -z "$CODE" ]; then
            echo "app/build.gradle.kts 里读不到 versionName / versionCode"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本 $VERSION（versionCode $CODE），标签 ${GITHUB_REF_NAME}"

      - name: 校验标签与版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          EXPECT="v${{ steps.version.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "$EXPECT" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 build.gradle.kts 里的 $EXPECT 不一致，先改版本号再打标签"
            exit 1
          fi

      - name: 导入 release 签名
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: 编译 Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          ls -lh app/build/outputs/apk/release/

      - name: 收集安装包
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "找不到 release APK"
            exit 1
          fi
          mkdir -p dist
          # 固定附件名，避免各端下载链接带版本号
          cp "$SRC" "dist/${ASSET_NAME}"
          cp "$SRC" "dist/MeifengWubi-${VERSION}.apk"
          ls -lh dist

      # 更新说明直接取 CHANGELOG.md 里对应版本的那一段
      - name: 生成更新说明
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v head="## v$VERSION" 'index($0, head) == 1 { show = 1; next } /^## v/ { show = 0 } show' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            echo "v$VERSION" > notes.md
          fi
          cat notes.md

      # 客户端 / 说明站可读：releases/latest/download/update.json
      - name: 生成更新清单
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CODE="${{ steps.version.outputs.code }}"
          HASH=$(sha256sum "dist/${ASSET_NAME}" | awk '{print $1}')
          SIZE=$(stat -c%s "dist/${ASSET_NAME}")
          export VERSION CODE HASH SIZE NOTES_FILE=notes.md
          python3 - <<'PY'
          import datetime, json, os

          notes = open(os.environ["NOTES_FILE"], encoding="utf-8").read().strip()
          repo = os.environ["GITHUB_REPOSITORY"]
          asset = os.environ["ASSET_NAME"]
          manifest = {
              "schema": 1,
              "platform": "android",
              "channel": "stable",
              "version": os.environ["VERSION"],
              "build": int(os.environ["CODE"] or 0),
              "published_at": datetime.date.today().isoformat(),
              "download_url": f"https://github.com/{repo}/releases/latest/download/{asset}",
              "sha256": os.environ["HASH"],
              "size": int(os.environ["SIZE"]),
              "min_system": "8.0",
              "minimum_version": "1.0.0",
              "notes": notes,
              "notes_url": f"https://github.com/{repo}/releases/tag/{os.environ['GITHUB_REF_NAME']}",
          }
          with open("dist/update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          cat dist/update.json

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MeifengWubi-${{ steps.version.outputs.version }}-android
          path: dist/*
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TITLE="v${{ steps.version.outputs.version }}"
          VERSION="${{ steps.version.outputs.version }}"

          FILES=("dist/${ASSET_NAME}" "dist/MeifengWubi-${VERSION}.apk" "dist/update.json")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --latest
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes-file notes.md --latest
          fi
          echo "已发布：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "固定下载：https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${ASSET_NAME}"
          echo "更新清单：https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/update.json"
